[project]
name = "numpert-fine-tune"
version = "0.1.0"
description = "Numerical perturbation fact-checking with fine-tuned LLMs"
requires-python = ">=3.11"
dependencies = [
    # Core ML dependencies
    "torch==2.9.1",
    "vllm==0.16.0",
    "transformers==4.57.6",
    "trl==0.24.0",
    "peft==0.18.0",
    "accelerate==1.5.0",
    "bitsandbytes==0.45.5",
    "datasets==3.4.1",
    "unsloth==2026.1.4",
    "unsloth-zoo==2026.1.4",
    "ollama",
    
    
    # NLP tools
    "spacy",
    "sentencepiece==0.2.0",
    "huggingface-hub>=0.30.0",
    
    # Data processing
    "numpy>=2.0.0",
    "pandas==2.2.3",
    "scipy==1.13.1",
    "scikit-learn>=1.5.0",
    
    # Utilities
    "word2number",
    "num2words",
    "fire==0.5.0",
    "tqdm==4.66.3",
    
    # Monitoring and visualization
    "wandb==0.19.9",
    "seaborn",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pip>=24.0",
    "pytest==7.2.1",
    "pytest-cov>=4.0.0",
    "ollama>=0.6.0",
    "black==23.1.0",
    "mypy==1.0.1",
    "flake8==7.1.1",
    "ruff==0.0.252",
    "pre-commit==3.1.0",
    "docformatter==1.7.5",
    "pydocstyle==6.3.0",
]

[tool.black]
line-length = 80
target-version = ['py311']

[tool.pydocstyle]
ignore = ["D104", "D211"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
norecursedirs = ["external", ".numpert-fine-tune", "*.egg-info"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_executable = ".numpert-fine-tune/bin/python"
explicit_package_bases = true
no_site_packages = true
# Somewhat deprecated scripts
# Exclude the src/metrics and llm eval directories from mypy analysis. Some script are somewhat depricated.
exclude = [
    "src/metrics/",
    "src/llm_eval",
    "^\\.numpert-fine-tune/"
]

[[tool.mypy.overrides]]
module = [
    "num2words.*",
    "torch.*",
    "spacy.*",
    "wandb.*",
    "unsloth.*",
    "unsloth.chat_templates.*",
    "sklearn.*",
    "huggingface_hub.*",
    "datasets.*",
    "matplotlib.*",
    "numpy.*",
    "transformers.*",
    "trl.*",
    "tqdm.*",
    "pandas.*",
    "pytest.*",
]
ignore_missing_imports = true
