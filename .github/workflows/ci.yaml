on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - "**.md"

env:
  REPO_NAME: ${{ github.event.repository.name }}

name: CI

jobs:
  build-and-test:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v7.0.7

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          architecture: x64
          python-version: 3.11.0
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv run python -m pip install -U pip
          uv sync
          uv run python -m spacy download en_core_web_trf

      - name: Run black
        shell: bash
        run: pre-commit run black --all-files

      - name: Run flake8
        shell: bash
        run: pre-commit run flake8 --all-files

      - name: Run docformatter
        shell: bash
        run: pre-commit run docformatter --all-files

      - name: Run pydocstyle
        shell: bash
        run: pre-commit run pydocstyle --all-files

      - name: Run mypy
        shell: bash
        run: pre-commit run mypy --all-files
   
      - name: Run pytest with code coverage
        run: |
          pytest --junitxml pytest.xml --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-branch | tee pytest-coverage.txt
        continue-on-error: false

      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: coverage.xml
        if: ${{ always() }}

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-py39
          path: pytest.xml

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-py39
          path: pytest-coverage.txt
          
  publish-test-results:
      name: "Publish Unit Tests Results"
      needs: build-and-test
      runs-on: ubuntu-latest
      if: always()
      timeout-minutes: 20

      steps:
        - name: Download Artifacts
          uses: actions/download-artifact@v3
          with:
            name: unit-test-py39
            path: unit-test-py39

        - name: Publish Unit Test Results
          uses: EnricoMi/publish-unit-test-result-action@v2
          with:
            files: unit-test-py39/*.xml

        - name: Download coverage report
          uses: actions/download-artifact@v3
          with:
            name: coverage-results

        - name: Pytest coverage comment in pull-request
          uses: MishaKav/pytest-coverage-comment@main
          with:
            default-branch: main
            pytest-coverage-path: unit-test-py39/pytest-coverage.txt
            junitxml-path: unit-test-py39/pytest.xml
            hide-badge: true
            hide-report: false
            create-new-comment: false
            hide-comment: false
            report-only-changed-files: true

        - name: Get the Coverage
          shell: bash
          run: |
            regex='<coverage.+line-rate="([0-9).[0-9]+)".+>'
            line=$(grep -oP $regex coverage.xml)
            [[ $line =~ $regex ]]
            coverage=$( bc <<< ${BASH_REMATCH[1]}*100 )
            if (( $(echo "$coverage > 90" |bc -l) )); then
              COLOR=green
            else
              COLOR=red
            fi
            echo "COVERAGE=${coverage%.*}%" >> $GITHUB_ENV
            echo "COLOR=$COLOR" >> $GITHUB_ENV

        - name: Create Coverage Badge
          uses: schneegans/dynamic-badges-action@v1.7.0
          with:
            auth: ${{ secrets.GIST_SECRET }}
            gistID: 4dc000699f87ec295368ae52250acc7a
            filename: coverage.${{ env.REPO_NAME }}.${{ github.event.number }}.json
            label: coverage
            message: ${{ env.COVERAGE }}
            color: ${{ env.COLOR }}

        - name: Find Comment
          uses: peter-evans/find-comment@v2
          id: fc
          with:
            issue-number: ${{ github.event.pull_request.number }}
            comment-author: "github-actions[bot]"
            body-includes: Current Branch | Main Branch

        - name: Create coverage comment
          uses: peter-evans/create-or-update-comment@v2
          with:
            comment-id: ${{ steps.fc.outputs.comment-id }}
            issue-number: ${{  github.event.pull_request.number }}
            reactions: eyes
            body: |
              Current Branch | Main Branch |
              | ------ | ------ |
              ![Coverage Badge](https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/vinaysetty/4dc000699f87ec295368ae52250acc7a/raw/coverage.${{ env.REPO_NAME }}.${{ github.event.number }}.json) | ![Coverage Badge](https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/vinaysetty/4dc000699f87ec295368ae52250acc7a/raw/coverage.${{ env.REPO_NAME }}.main.json) |
            edit-mode: replace

