name: Deploy

on:
  push:
    branches:
      - main

# Necessary for modern GITHUB_TOKEN security standards
permissions:
  contents: read
  packages: write

env:
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-test:
    name: "Build and Test Python 3.11"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc graphviz

      - name: Install Python Dependencies
        # --frozen ensures we use the exact versions in your uv.lock
        # --extra dev installs pytest, ruff, etc.
        run: |
          uv sync --frozen --extra dev
          uv run python -m spacy download en_core_web_trf

      - name: Run Ruff Check
        run: uv run ruff check .

      - name: Run Type Check (MyPy)
        # Since you have an extensive MyPy config in pyproject.toml
        run: uv run mypy .

      - name: PyTest with code coverage
        run: |
          uv run pytest --cov=. --cov-report=xml --cov-branch

      - name: Get the Coverage
        id: coverage_data
        shell: bash
        run: |
          # Extract line-rate from coverage.xml
          line_rate=$(grep -oP '(?<=line-rate=")[^"]+' coverage.xml | head -n 1)
          # Convert decimal (e.g. 0.95) to percentage (95)
          coverage=$(echo "$line_rate * 100 / 1" | bc)
          
          if [ "$coverage" -gt 90 ]; then
            COLOR=green
          else
            COLOR=red
          fi
          
          echo "COVERAGE=${coverage}%" >> $GITHUB_ENV
          echo "COLOR=$COLOR" >> $GITHUB_ENV

      - name: Create Coverage Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 4dc000699f87ec295368ae52250acc7a
          filename: coverage.${{ env.REPO_NAME }}.main.json
          label: coverage
          message: ${{ env.COVERAGE }}
          color: ${{ env.COLOR }}
