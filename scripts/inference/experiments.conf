#!/bin/bash
################################################################################
# Inference Experiment Configuration Registry
#
# Each experiment is a bash function that sets inference variables.
# Add new experiments by defining a new function prefixed with "experiment_".
#
# USAGE:
#   bash scripts/inference/experiments/run_experiment.sh <experiment_name>
#   bash scripts/inference/experiments/run_experiment.sh --list
#   bash scripts/inference/experiments/run_experiment.sh --show <name>
#   bash scripts/inference/experiments/run_experiment.sh --dry-run <name>
#   sbatch scripts/inference/experiments/slurm_experiment.sh <name>
#
# NAMING CONVENTION:
#   experiment_<group>_<model>_<data_variant>
#     group:        base | ft_normalized | ft_perturbed | ft_enhanced
#     model:        qwen3_8b | qwen3_32b
#     data_variant: all_test_filtered | all_test_with_type2 | all_test_true_only
#   e.g. experiment_base_qwen3_8b_all_test_filtered
#        experiment_ft_perturbed_qwen3_8b_all_test_with_type2
#        experiment_ft_enhanced_qwen3_32b_all_test_true_only
#
# ADDING A NEW EXPERIMENT:
#   1. Copy any existing function below
#   2. Rename it with the experiment_ prefix
#   3. Adjust the variables
#   That's it — the launcher auto-discovers all experiment_ functions.
################################################################################

# ==============================================================================
# DEFAULTS — inherited by all experiments unless overridden
# ==============================================================================
_set_defaults() {
    # Model
    MODEL="unsloth"                  # Model path, HF id, or alias
    RANK=32
    START_EPOCH=0
    MAX_SEQ_LENGTH=16384

    # Dataset
    EXPAND_PERTURBATIONS=true

    # Output (auto-generates run name if empty)
    OUTPUT_DIR=""
}

# ==============================================================================
# DATA PATH PRESETS — test split (all perturbation types)
#
# Type filtering rules (matching training conventions):
#   True files  → type1,type2 (all structure-preserving + value-modifying)
#   False files → type1 only  (exclude type2 to avoid double-negation noise)
#   negative:   → type2 only
#   obfuscation → type3_random, type3_masked (omit type3_removed — noise)
# ==============================================================================

_test_all() {
    TEST_JSON=(
        "data/perturbed_data/test_split/numeration_True.json"
        "data/perturbed_data/test_split/numeration_False.json"
        "data/perturbed_data/test_split/approximation_True.json"
        "data/perturbed_data/test_split/approximation_False.json"
        "data/perturbed_data/test_split/negative_True.json"
        "data/perturbed_data/test_split/negative_False.json"
        "data/perturbed_data/test_split/obfuscation_True.json:type3_random,type3_masked"
        "data/perturbed_data/test_split/obfuscation_False.json:type3_random,type3_masked"
        "data/perturbed_data/test_split/range_True.json"
        "data/perturbed_data/test_split/range_False.json"
    )
}

_test_all_filtered() {
    # Per PERTURBATIONS.md:
    #   numeration:    type1, type2
    #   approximation: type1, type2
    #   range:         type1, type2
    #   negative:      type2 only
    #   obfuscation:   type3 only (random, masked)
    # For False files: exclude type2 (double negation → noisy labels)
    TEST_JSON=(
        "data/perturbed_data/test_split/numeration_True.json:type1,type2"
        "data/perturbed_data/test_split/numeration_False.json:type1"
        "data/perturbed_data/test_split/approximation_True.json:type1,type2"
        "data/perturbed_data/test_split/approximation_False.json:type1"
        "data/perturbed_data/test_split/range_True.json:type1,type2"
        "data/perturbed_data/test_split/range_False.json:type1"
        "data/perturbed_data/test_split/negative_True.json:type2"
        "data/perturbed_data/test_split/negative_False.json:type2"
        "data/perturbed_data/test_split/obfuscation_True.json:type3_random,type3_masked"
        "data/perturbed_data/test_split/obfuscation_False.json:type3_random,type3_masked"
    )
}

_test_all_with_type2() {
    # Same as _test_all_filtered but type2 is also included for False files.
    # type2 flips the label, so False originals → True perturbed examples.
    TEST_JSON=(
        "data/perturbed_data/test_split/numeration_True.json:type1,type2"
        "data/perturbed_data/test_split/numeration_False.json:type1,type2"
        "data/perturbed_data/test_split/approximation_True.json:type1,type2"
        "data/perturbed_data/test_split/approximation_False.json:type1,type2"
        "data/perturbed_data/test_split/range_True.json:type1,type2"
        "data/perturbed_data/test_split/range_False.json:type1,type2"
        "data/perturbed_data/test_split/negative_True.json:type2"
        "data/perturbed_data/test_split/negative_False.json:type2"
        "data/perturbed_data/test_split/obfuscation_True.json:type3_random,type3_masked"
        "data/perturbed_data/test_split/obfuscation_False.json:type3_random,type3_masked"
    )
}


_test_all_true_only() {
    # Only True split files — all perturbations are T→F (type2) or
    # structure-preserving (type1). No False-original claims.
    TEST_JSON=(
        "data/perturbed_data/test_split/numeration_True.json:type1,type2"
        "data/perturbed_data/test_split/approximation_True.json:type1,type2"
        "data/perturbed_data/test_split/range_True.json:type1,type2"
        "data/perturbed_data/test_split/negative_True.json:type2"
        "data/perturbed_data/test_split/obfuscation_True.json:type3_random,type3_masked"
    )
}


################################################################################
#                         MODEL PATH HELPERS
#
# Set MODEL (and optionally START_EPOCH / RANK) for each model category.
# Fine-tuned paths follow the training save convention:
#   {prefix}tuned_models/epoch-{N}/{model_name}/lora_weights[_r{rank}]
# Replace the REPLACE_WITH_PATH placeholders once models are trained.
################################################################################

# ------------------------------------------------------------------------------
# GROUP 1 — Base HF models (no fine-tuning)
# ------------------------------------------------------------------------------
_model_base_8b()  { MODEL="unsloth/Qwen3-8B";  START_EPOCH=0; }
_model_base_32b() { MODEL="unsloth/Qwen3-32B"; START_EPOCH=0; }

# ------------------------------------------------------------------------------
# GROUP 2 — Fine-tuned on normalized claims only (no perturbation expansion)
# Trained with --expand_perturbations false (original_normalized claims only).
# ------------------------------------------------------------------------------
_model_ft_normalized_8b() {
    MODEL="REPLACE_WITH_PATH"   # e.g. tuned_models/epoch-3/Qwen3-8B/lora_weights
    START_EPOCH=0               # set >0 to resolve checkpoint from tuned_models/
    EXPAND_PERTURBATIONS=false  # model was trained on normalized claims only
}
_model_ft_normalized_32b() {
    MODEL="REPLACE_WITH_PATH"
    START_EPOCH=0
    EXPAND_PERTURBATIONS=false
}

# ------------------------------------------------------------------------------
# GROUP 3 — Fine-tuned on perturbed + non-perturbed data, normal batching
# Trained with --expand_perturbations and standard (random) batch sampling.
# ------------------------------------------------------------------------------
_model_ft_perturbed_8b() {
    MODEL="REPLACE_WITH_PATH"   # e.g. tuned_models/epoch-3/Qwen3-8B/lora_weights
    START_EPOCH=0
}
_model_ft_perturbed_32b() {
    MODEL="REPLACE_WITH_PATH"
    START_EPOCH=0
}

# ------------------------------------------------------------------------------
# GROUP 4 — Fine-tuned on perturbed + non-perturbed data, enhanced batching
# Trained with --batch_match_claim_id (claim-grouped batches).
# ------------------------------------------------------------------------------
_model_ft_enhanced_8b() {
    MODEL="REPLACE_WITH_PATH"   # e.g. tuned_models/epoch-3/Qwen3-8B/lora_weights
    START_EPOCH=0
}
_model_ft_enhanced_32b() {
    MODEL="REPLACE_WITH_PATH"
    START_EPOCH=0
}


################################################################################
#                          EXPERIMENT DEFINITIONS
#
# NAMING: experiment_<group>_<model>_<data_variant>
#   group:         base | ft_normalized | ft_perturbed | ft_enhanced
#   model:         qwen3_8b | qwen3_32b
#   data_variant:  all_test | all_test_filtered | all_test_with_type2 |
#                  all_test_true_only
################################################################################

# ==============================================================================
# GROUP 1 — Base HF models (no fine-tuning)
# ==============================================================================

experiment_base_qwen3_8b_all_test_filtered() {
    _set_defaults
    _model_base_8b
    _test_all_filtered
    OUTPUT_DIR="results/inference/base_qwen3_8b/all_test_filtered"
}

experiment_base_qwen3_8b_all_test_with_type2() {
    _set_defaults
    _model_base_8b
    _test_all_with_type2
    OUTPUT_DIR="results/inference/base_qwen3_8b/all_test_with_type2"
}

experiment_base_qwen3_8b_all_test_true_only() {
    _set_defaults
    _model_base_8b
    _test_all_true_only
    OUTPUT_DIR="results/inference/base_qwen3_8b/all_test_true_only"
