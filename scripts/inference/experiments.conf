# VitaminC numerical test split.
# VitaminC provides NATURALLY OCCURRING numerical contrastive pairs harvested
# from real Wikipedia revisions: the same claim is paired with a supporting and
# a refuting evidence document. No synthetic perturbations are applied here
# (the records carry only original claims, no perturb_* fields), so this preset
# sets USE_PERTURBATIONS=false. Because the variation lives on the EVIDENCE
# side rather than the claim side, the claim text repeats across instances and
# deduplication must be keyed on (text, label) (--dedup_mode text_label) or
# one member of every contrastive pair would be silently dropped.
_test_vitaminc() {
    TEST_JSON=(
        "data/vitaminc/vitaminc_test_numerical.json"
    )
    USE_PERTURBATIONS=false
}

_test_arabic_val() {
    TEST_JSON=(
        "data/arabic/perturbed/val_split/numeration_True.json:type1,type2"
        "data/arabic/perturbed/val_split/numeration_False.json:type1,type2"
        "data/arabic/perturbed/val_split/approximation_True.json:type1,type2"
        "data/arabic/perturbed/val_split/approximation_False.json:type1,type2"
        "data/arabic/perturbed/val_split/range_True.json:type1,type2"
        "data/arabic/perturbed/val_split/range_False.json:type1,type2"
        "data/arabic/perturbed/val_split/negative_True.json:type2"
        "data/arabic/perturbed/val_split/negative_False.json:type2"
        "data/arabic/perturbed/val_split/obfuscation_True.json:type3_random"
        "data/arabic/perturbed/val_split/obfuscation_False.json:type3_random"
    )
}

