_use_model_target() {
    local model_path="$1"
    local default_model="$2"
    local output_dir="$3"

    if [ -n "$model_path" ] && [[ "$model_path" != REPLACE_WITH_* ]]; then
        MODEL="$model_path"
    else
        MODEL="$default_model"
    fi

    OUTPUT_DIR="$output_dir"
}


