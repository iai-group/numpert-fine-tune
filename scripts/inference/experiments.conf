    _set_defaults
    _test_vitaminc
    _use_model_target "$QWEN3_8B_MODEL_BASELINE_GGUF_PATH" "$QWEN3_8B_MODEL_BASELINE_GGUF_PATH" "$QWEN3_8B_MODEL_BASELINE_GGUF_VITAMINC_OUTPUT_DIR"
    TOKENIZER="unsloth/Qwen3-8B"
    EXTRA_INFERENCE_ARGS="--no_thinking --dedup_mode none"
}

