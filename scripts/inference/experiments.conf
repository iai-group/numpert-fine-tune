#!/bin/bash
################################################################################
# Inference Experiment Registry: all_test_with_type2, five fixed model slots
#
# This registry is intended for evaluating five specific model targets against
# the `_test_all_with_type2` dataset preset. Each slot binds together:
#   1. a preferred local model path
#   2. a fallback/default model alias
#   3. a fixed output directory
#
# Usage:
#   bash scripts/inference/run_experiment.sh --list
#   bash scripts/inference/run_experiment.sh baseline_unsloth_unquantized_all_test_with_type2
#   bash scripts/inference/run_experiment.sh no_approx_trained_unsloth_unquantized_all_test_with_type2
#   bash scripts/inference/run_experiment.sh no_num_trained_unsloth_unquantized_all_test_with_type2
#   bash scripts/inference/run_experiment.sh no_range_trained_unsloth_unquantized_all_test_with_type2
#   bash scripts/inference/run_experiment.sh normalized_claims_trained_unsloth_unquantized_all_test_with_type2
#   bash scripts/inference/run_experiment.sh baseline_gguf_all_test_with_type2
#   bash scripts/inference/run_experiment.sh no_approx_trained_gguf_all_test_with_type2
#   bash scripts/inference/run_experiment.sh no_num_trained_gguf_all_test_with_type2
#   bash scripts/inference/run_experiment.sh no_range_trained_gguf_all_test_with_type2
#   bash scripts/inference/run_experiment.sh normalized_claims_trained_gguf_all_test_with_type2
################################################################################

# ==============================================================================
# DEFAULTS
# ==============================================================================
_set_defaults() {
    MODEL="unsloth/Qwen3-8B"
    TOKENIZER="unsloth/Qwen3-8B"
    RANK=32
    START_EPOCH=0
    MAX_SEQ_LENGTH=16384
    USE_PERTURBATIONS=true
    OUTPUT_DIR=""
}

# ==============================================================================
# TEST DATA PRESET
# ==============================================================================
_test_all_with_type2() {
    # Same as _test_all_filtered but type2 is also included for False files.
    # type2 flips the label, so False originals -> True perturbed examples.
    TEST_JSON=(
        "data/perturbed_data/test_split/numeration_True.json:type1,type2"
        "data/perturbed_data/test_split/numeration_False.json:type1,type2"
        "data/perturbed_data/test_split/approximation_True.json:type1,type2"
        "data/perturbed_data/test_split/approximation_False.json:type1,type2"
        "data/perturbed_data/test_split/range_True.json:type1,type2"
        "data/perturbed_data/test_split/range_False.json:type1,type2"
        "data/perturbed_data/test_split/negative_True.json:type2"
        "data/perturbed_data/test_split/negative_False.json:type2"
        "data/perturbed_data/test_split/obfuscation_True.json:type3_random,type3_masked"
        "data/perturbed_data/test_split/obfuscation_False.json:type3_random,type3_masked"
    )
}

# ==============================================================================
# MODEL TARGET SLOTS
#
# Replace MODEL_SLOT_*_PATH with the real checkpoint directory when available.
# Until then, each experiment falls back to its DEFAULT model alias.
# ==============================================================================
MODEL_BASELINE_PATH="unsloth/Qwen3-8B"
MODEL_BASELINE_OUTPUT_DIR="results/inference/qwen3-8b/baseline_test2"

MODEL_NO_APPROX_PATH=".models/Qwen3-8B-daring-ant-evolves_no_approx_no_f2f_type2/epoch-2/merged_model_r32"
MODEL_NO_APPROX_OUTPUT_DIR="results/inference/qwen3-8b/Qwen3-8B-daring-ant-evolves_no_approx_no_f2f_type2"

MODEL_NO_NUM_PATH=".models/Qwen3-8B-daring-ant-evolves_no_num_no_f2f_type2/epoch-2/merged_model_r32"
MODEL_NO_NUM_OUTPUT_DIR="results/inference/qwen3-8b/Qwen3-8B-daring-ant-evolves_no_num_no_f2f_type2"

MODEL_NO_RANGE_PATH=".models/Qwen3-8B-daring-ant-evolves_no_range_no_f2f_type2/epoch-2/merged_model_r32"
MODEL_NO_RANGE_OUTPUT_DIR="results/inference/qwen3-8b/Qwen3-8B-daring-ant-evolves_no_range_no_f2f_type2"

MODEL_NORMALIZED_CLAIMS_PATH=".models/Qwen3-8B-daring-ant-evolves_normalized_claims_no_perturb_split/epoch-2/merged_model_r32"
MODEL_NORMALIZED_CLAIMS_OUTPUT_DIR="results/inference/qwen3-8b/Qwen3-8B-daring-ant-evolves_normalized_claims_no_perturb_split"

MODEL_BASELINE_GGUF_PATH=".models/gguf/Qwen3-8B-baseline_q4_k_m/946bc9ac74a6c1f8cf012497c503a119b2fcf2eb-q4_k_m.gguf"
MODEL_BASELINE_GGUF_OUTPUT_DIR="results/inference/qwen3-8b-q4_k_m/Qwen3-8B-baseline_q4_k_m"

MODEL_NO_APPROX_GGUF_PATH=".models/gguf/Qwen3-8B-daring-ant-evolves_no_approx_no_f2f_type2_q4_k_m/merged_model_r32-q4_k_m.gguf"
MODEL_NO_APPROX_GGUF_OUTPUT_DIR="results/inference/qwen3-8b-q4_k_m/Qwen3-8B-daring-ant-evolves_no_approx_no_f2f_type2_q4_k_m"

MODEL_NO_NUM_GGUF_PATH=".models/gguf/Qwen3-8B-daring-ant-evolves_no_num_no_f2f_type2_q4_k_m/merged_model_r32-q4_k_m.gguf"
MODEL_NO_NUM_GGUF_OUTPUT_DIR="results/inference/qwen3-8b-q4_k_m/Qwen3-8B-daring-ant-evolves_no_num_no_f2f_type2_q4_k_m"

MODEL_NO_RANGE_GGUF_PATH=".models/gguf/Qwen3-8B-daring-ant-evolves_no_range_no_f2f_type2_q4_k_m/merged_model_r32-q4_k_m.gguf"
MODEL_NO_RANGE_GGUF_OUTPUT_DIR="results/inference/qwen3-8b-q4_k_m/Qwen3-8B-daring-ant-evolves_no_range_no_f2f_type2_q4_k_m"

MODEL_NORMALIZED_CLAIMS_GGUF_PATH=".models/gguf/Qwen3-8B-daring-ant-evolves_normalized_claims_no_perturb_split_q4_k_m/merged_model_r32-q4_k_m.gguf"
MODEL_NORMALIZED_CLAIMS_GGUF_OUTPUT_DIR="results/inference/qwen3-8b-q4_k_m/Qwen3-8B-daring-ant-evolves_normalized_claims_no_perturb_split_q4_k_m"

_use_model_target() {
    local model_path="$1"
    local default_model="$2"
    local output_dir="$3"

    if [ -n "$model_path" ] && [[ "$model_path" != REPLACE_WITH_* ]]; then
        MODEL="$model_path"
    else
        MODEL="$default_model"
    fi

    OUTPUT_DIR="$output_dir"
}


################################################################################
# EXPERIMENT DEFINITIONS
################################################################################

experiment_baseline_unsloth_unquantized_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_BASELINE_PATH" "$MODEL_BASELINE_PATH" "$MODEL_BASELINE_OUTPUT_DIR"
}

experiment_no_approx_trained_unsloth_unquantized_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NO_APPROX_PATH" "$MODEL_NO_APPROX_PATH" "$MODEL_NO_APPROX_OUTPUT_DIR"
}

experiment_no_num_trained_unsloth_unquantized_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NO_NUM_PATH" "$MODEL_NO_NUM_PATH" "$MODEL_NO_NUM_OUTPUT_DIR"
}

experiment_no_range_trained_unsloth_unquantized_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NO_RANGE_PATH" "$MODEL_NO_RANGE_PATH" "$MODEL_NO_RANGE_OUTPUT_DIR"
}

experiment_normalized_claims_trained_unsloth_unquantized_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NORMALIZED_CLAIMS_PATH" "$MODEL_NORMALIZED_CLAIMS_PATH" "$MODEL_NORMALIZED_CLAIMS_OUTPUT_DIR"
}

experiment_baseline_gguf_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_BASELINE_GGUF_PATH" "$MODEL_BASELINE_GGUF_PATH" "$MODEL_BASELINE_GGUF_OUTPUT_DIR"
    TOKENIZER="unsloth/Qwen3-8B"
}

experiment_no_approx_trained_gguf_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NO_APPROX_GGUF_PATH" "$MODEL_NO_APPROX_GGUF_PATH" "$MODEL_NO_APPROX_GGUF_OUTPUT_DIR"
    TOKENIZER="unsloth/Qwen3-8B"
}

experiment_no_num_trained_gguf_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NO_NUM_GGUF_PATH" "$MODEL_NO_NUM_GGUF_PATH" "$MODEL_NO_NUM_GGUF_OUTPUT_DIR"
    TOKENIZER="unsloth/Qwen3-8B"
}

experiment_no_range_trained_gguf_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NO_RANGE_GGUF_PATH" "$MODEL_NO_RANGE_GGUF_PATH" "$MODEL_NO_RANGE_GGUF_OUTPUT_DIR"
    TOKENIZER="unsloth/Qwen3-8B"
}

experiment_normalized_claims_trained_gguf_all_test_with_type2() {
    _set_defaults
    _test_all_with_type2
    _use_model_target "$MODEL_NORMALIZED_CLAIMS_GGUF_PATH" "$MODEL_NORMALIZED_CLAIMS_GGUF_PATH" "$MODEL_NORMALIZED_CLAIMS_GGUF_OUTPUT_DIR"
    TOKENIZER="unsloth/Qwen3-8B"
}