#   # AVeriTeC generalisation experiments
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_no_approx_gguf_averitec_dev
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_baseline_gguf_averitec_dev
