# ==============================================================================
# VitaminC numerical test split — evidence-side generalisation experiments
#
# VitaminC (Schuster et al., NAACL 2021) provides NATURALLY OCCURRING numerical
# contrastive pairs mined from real Wikipedia revisions: the same claim appears
# twice, once with evidence that supports it and once with evidence that
# refutes it. No synthetic perturbations are applied (the data has no perturb_*
# fields, hence USE_PERTURBATIONS=false); this tests robustness to
# EVIDENCE-side numerical variation rather than the claim-side perturbations
# used elsewhere in this registry. Deduplication must therefore be keyed on
# (text, label) via --dedup_mode text_label, so that both members of each
# contrastive pair are evaluated while true repetitions are still removed.
# ==============================================================================

QWEN3_8B_MODEL_BASELINE_GGUF_VITAMINC_OUTPUT_DIR="results/inference/vitaminc/qwen3-8b-q4_k_m/baseline"
