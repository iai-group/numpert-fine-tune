# Inference Experiment Registry: all_test_with_type2, five fixed model slots
#
# This registry is intended for evaluating five specific model targets against
# the `_test_all_with_type2` dataset preset. Each slot binds together:
#   1. a preferred local model path
#   2. a fallback/default model alias
#   3. a fixed output directory
#
# Usage:
#   bash scripts/inference/slurm_experiment.sh --list
#
#   # Zero-shot (default)
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_baseline_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_no_approx_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_no_num_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_no_range_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_normalized_claims_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_baseline_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_no_approx_trained_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_no_num_trained_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_no_range_trained_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_normalized_claims_trained_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_baseline_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_no_approx_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_no_num_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_no_range_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_normalized_claims_trained_unsloth_unquantized_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_baseline_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_no_approx_trained_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_no_num_trained_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_no_range_trained_gguf_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_normalized_claims_trained_gguf_all_test_with_type2
#
#   # Few-shot baseline experiments
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_baseline_unsloth_unquantized_few_shot_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_8b_baseline_gguf_few_shot_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_baseline_unsloth_unquantized_few_shot_all_test_with_type2
#   sbatch scripts/inference/slurm_experiment.sh qwen3_32b_baseline_gguf_few_shot_all_test_with_type2
