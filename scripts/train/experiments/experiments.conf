# No perturb claims split:
# Uses same file paths and filtering. Maps original claim ID's from all files, and deduplicates across files. No claim ID-based balancing (oversampling)
_no_perturb_data_split() {
    TRAIN_JSON=(
        "./data/perturbed_data/train_split/numeration_True.json:type1,type2"
        "./data/perturbed_data/train_split/numeration_False.json:type1"
        "./data/perturbed_data/train_split/approximation_True.json:type1,type2"
