#!/bin/bash
################################################################################
# Experiment Configuration Registry
#
# Each experiment is a bash function that sets training variables.
# Add new experiments by defining a new function prefixed with "experiment_".
#
# USAGE:
#   bash scripts/experiments/run_experiment.sh <experiment_name>   # run locally
#   bash scripts/experiments/run_experiment.sh --list              # list all
#   bash scripts/experiments/run_experiment.sh --show <name>       # show config
#   sbatch scripts/experiments/slurm_experiment.sh <name>          # via SLURM
#
# NAMING CONVENTION:
#   experiment_<model>_<data>_<batching>[_<variant>]
#   e.g. experiment_qwen3_8b_numeration_enhanced
#
# ADDING A NEW EXPERIMENT:
#   1. Copy any existing function below
#   2. Rename it with the experiment_ prefix
#   3. Adjust the variables
#   That's it — the launcher auto-discovers all experiment_ functions.
################################################################################

# ==============================================================================
# DEFAULTS — inherited by all experiments unless overridden
# ==============================================================================
_set_defaults() {
    # Model
    MODEL="Qwen3-8B"
    RANK=32
    START_EPOCH=1
    NUM_TRAIN_EPOCHS=3
    RESUME_MODEL=""

    # Training
    BATCH_SIZE=5
    GRAD_ACCUM=1
    MAX_SEQ_LENGTH=8192

    # Balancing
    BALANCE_LABELS=true
    PERTURB_RATIO=1.0
    FALSE_T_TO_F_RATIO=0.67

    # Batch matching (off by default = normal batching)
    BATCH_MATCH_CLAIM_ID=false
    SPLIT_LARGE_CLAIMS=false
    ENSURE_ORIGINAL_IN_BATCH=false
    ENSURE_PERTURBED_IN_BATCH=false

    # Eval & checkpointing
    EVAL_STEPS=500
    SAVE_STEPS=500

    # GGUF
    SAVE_GGUF=false
    GGUF_QUANT_METHOD="q4_k_m"

    # Debug
    DEBUG=false
}

# ==============================================================================
# HELPER — enable enhanced (claim-matched) batching
# ==============================================================================
_enable_enhanced_batching() {
    BATCH_MATCH_CLAIM_ID=true
    SPLIT_LARGE_CLAIMS=true
    ENSURE_ORIGINAL_IN_BATCH=true
    ENSURE_PERTURBED_IN_BATCH=true
}

# ==============================================================================
# DATA PATH PRESETS
# Call these inside experiment functions to set TRAIN_JSON / VAL_JSON easily.
# ==============================================================================

# Numeration only (type1 + type2 for True, type1 only for False)
_data_numeration_filtered() {
    TRAIN_JSON=(
        "./data/perturbed_data/train_split/numeration_True.json:type1,type2"
        "./data/perturbed_data/train_split/numeration_False.json:type1"
    )
    VAL_JSON=(
        "./data/perturbed_data/val_split/numeration_True.json:type1,type2"
        "./data/perturbed_data/val_split/numeration_False.json:type1"
    )
}

# Numeration only (all types, no filtering)
_data_numeration_all() {
    TRAIN_JSON=(
        "./data/perturbed_data/train_split/numeration_True.json"
        "./data/perturbed_data/train_split/numeration_False.json"
    )
    VAL_JSON=(
        "./data/perturbed_data/val_split/numeration_True.json"
        "./data/perturbed_data/val_split/numeration_False.json"
    )
}

# All perturbation types (numeration + approximation + negative + obfuscation + range)
_data_all_perturbations() {
    TRAIN_JSON=(
        "./data/perturbed_data/train_split/numeration_True.json"
        "./data/perturbed_data/train_split/numeration_False.json"
        "./data/perturbed_data/train_split/approximation_True.json"
        "./data/perturbed_data/train_split/approximation_False.json"
        "./data/perturbed_data/train_split/negative_True.json"
        "./data/perturbed_data/train_split/negative_False.json"
        "./data/perturbed_data/train_split/obfuscation_True.json"
        "./data/perturbed_data/train_split/obfuscation_False.json"
        "./data/perturbed_data/train_split/range_True.json"
        "./data/perturbed_data/train_split/range_False.json"
    )
    VAL_JSON=(
        "./data/perturbed_data/val_split/numeration_True.json"
        "./data/perturbed_data/val_split/numeration_False.json"
        "./data/perturbed_data/val_split/approximation_True.json"
        "./data/perturbed_data/val_split/approximation_False.json"
        "./data/perturbed_data/val_split/negative_True.json"
        "./data/perturbed_data/val_split/negative_False.json"
        "./data/perturbed_data/val_split/obfuscation_True.json"
        "./data/perturbed_data/val_split/obfuscation_False.json"
        "./data/perturbed_data/val_split/range_True.json"
        "./data/perturbed_data/val_split/range_False.json"
    )
}

# All perturbation types with type filtering (type1+type2 True, type1 only False)
_data_all_perturbations_filtered() {
    TRAIN_JSON=(
        "./data/perturbed_data/train_split/numeration_True.json:type1,type2"
        "./data/perturbed_data/train_split/numeration_False.json:type1"
        "./data/perturbed_data/train_split/approximation_True.json:type1,type2"
        "./data/perturbed_data/train_split/approximation_False.json:type1"
        "./data/perturbed_data/train_split/negative_True.json:type1,type2"
        "./data/perturbed_data/train_split/negative_False.json:type1"
        "./data/perturbed_data/train_split/obfuscation_True.json:type1,type2"
        "./data/perturbed_data/train_split/obfuscation_False.json:type1"
        "./data/perturbed_data/train_split/range_True.json:type1,type2"
        "./data/perturbed_data/train_split/range_False.json:type1"
    )
    VAL_JSON=(
        "./data/perturbed_data/val_split/numeration_True.json:type1,type2"
        "./data/perturbed_data/val_split/numeration_False.json:type1"
        "./data/perturbed_data/val_split/approximation_True.json:type1,type2"
        "./data/perturbed_data/val_split/approximation_False.json:type1"
        "./data/perturbed_data/val_split/negative_True.json:type1,type2"
        "./data/perturbed_data/val_split/negative_False.json:type1"
        "./data/perturbed_data/val_split/obfuscation_True.json:type1,type2"
        "./data/perturbed_data/val_split/obfuscation_False.json:type1"
        "./data/perturbed_data/val_split/range_True.json:type1,type2"
        "./data/perturbed_data/val_split/range_False.json:type1"
    )
}


################################################################################
#                          EXPERIMENT DEFINITIONS
################################################################################

# ==============================================================================
# QWEN3-8B EXPERIMENTS
# ==============================================================================

# --- Numeration, Normal Batching ---
experiment_qwen3_8b_numeration_normal() {
    _set_defaults
    _data_numeration_filtered
    PERTURB_TYPE_NAMES="numeration_normal_batched"
}

# --- Numeration, Enhanced Batching ---
experiment_qwen3_8b_numeration_enhanced() {
    _set_defaults
    _data_numeration_filtered
    _enable_enhanced_batching
    PERTURB_TYPE_NAMES="numeration_enhanced_batched"
}

