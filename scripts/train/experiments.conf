# ==============================================================================
# QWEN3-8B EXPERIMENTS
# ==============================================================================

# --- Experiments normal batching but filtered types  ---
# True data includes all types (type1, type2), False data excludes type2

# No numeration claims fine-tune
exp_qwen3_8b_no_numeration_no_f2f_type2() {
    _set_defaults
    _no_numeration_no_f2f_type2
    PERTURB_TYPE_NAMES="no_num_no_f2f_type2"
}

# No approximation claims fine-tune
exp_qwen3_8b_no_approximation_no_f2f_type2() {
    _set_defaults
    _no_approximation_no_f2f_type2
    PERTURB_TYPE_NAMES="no_approx_no_f2f_type2"
}

# No range claims fine-tune
exp_qwen3_8b_no_range_no_f2f_type2() {
    _set_defaults
    _no_range_no_f2f_type2
    PERTURB_TYPE_NAMES="no_range_no_f2f_type2"
}


# Finetune normalized claims (non-perturbed)
# Mapping claim ID's across all files, and deduplicating. No claim ID-based balancing (oversampling).
# Uses only claims ID's that would have been included in perturb experiments (i.e. does not use original quantemp datasplit which would have been larger)
exp_qwen3_8b_no_perturb_data_split() {
    _set_defaults
    _no_perturb_data_split
    USE_PERTURBATIONS=FALSE
    PERTURB_TYPE_NAMES="normalized_claims_no_perturb_split"
}


################################################################################
#                    PEFT (PARAMETER-EFFICIENT) EXPERIMENTS
################################################################################
# PEFT methods: lora, prompt_tuning, prefix_tuning, lora_prompt, lora_prefix
# These experiments train using the new PEFT module instead of Unsloth LoRA
#
# Key differences from Unsloth experiments:
#   - Uses peft_finetune.py instead of unsloth_finetune.py
#   - Supports multiple PEFT methods
#   - Tracks inference efficiency metrics
#   - Can compare methods side-by-side
#
# USAGE:
#   bash scripts/train/run_experiment.sh peft_qwen3_8b_lora
#   sbatch scripts/train/slurm_peft_experiment.sh peft_qwen3_8b_lora

# ==============================================================================
# PEFT EXPERIMENT DEFAULTS
# ==============================================================================
_set_peft_defaults() {
    # Model — use full HuggingFace identifier for PEFT (unlike Unsloth which has get_model_name_arg)
    MODEL="Qwen/Qwen3-8B"
    RANK=32                 # Default (not used by PEFT, but kept for compatibility)
    START_EPOCH=0
    NUM_TRAIN_EPOCHS=1
    RESUME_MODEL=""
    
    # PEFT specific
    PEFT_METHOD="lora"      # Options: lora, prompt_tuning, prefix_tuning, lora_prompt, lora_prefix
    PEFT_RANK=32            # For LoRA-based methods
    PEFT_VIRTUAL_TOKENS=20  # For Prompt/Prefix Tuning
    
    # Training
    BATCH_SIZE=2
    GRAD_ACCUM=1
    MAX_SEQ_LENGTH=16384
    
    # Data
    USE_PERTURBATIONS=TRUE
    PERTURB_RATIO=1.0
    FALSE_PERTURB_T_TO_F_RATIO=0.67
    METHOD_BALANCE_MODE=oversample
    
    # Batch matching (off by default = normal batching)
    BATCH_MATCH_CLAIM_ID=false
    SPLIT_LARGE_CLAIMS=false
    ENSURE_ORIGINAL_IN_BATCH=false
    ENSURE_PERTURBED_IN_BATCH=false
    
    # Eval
    EVAL_STEPS=0.25
    
    # GGUF
    SAVE_GGUF=false
    GGUF_QUANT_METHOD="q4_k_m"
    
    # Debug
    DEBUG=false
    
    # Perturbation types (all types)
    PERTURB_TYPE_NAMES="numeration,approximation,range,negative,obfuscation"
    
    # Paths (reuse Unsloth experiment data splits)
    TRAIN_JSON=(
        "./data/perturbed_data/train_split/numeration_True.json"
        "./data/perturbed_data/train_split/numeration_False.json"
        "./data/perturbed_data/train_split/approximation_True.json"
        "./data/perturbed_data/train_split/approximation_False.json"
        "./data/perturbed_data/train_split/range_True.json"
        "./data/perturbed_data/train_split/range_False.json"
        "./data/perturbed_data/train_split/negative_True.json"
        "./data/perturbed_data/train_split/negative_False.json"
        "./data/perturbed_data/train_split/obfuscation_True.json"
        "./data/perturbed_data/train_split/obfuscation_False.json"
    )
    VAL_JSON=(
        "./data/perturbed_data/val_split/numeration_True.json"
        "./data/perturbed_data/val_split/numeration_False.json"
        "./data/perturbed_data/val_split/approximation_True.json"
        "./data/perturbed_data/val_split/approximation_False.json"
        "./data/perturbed_data/val_split/range_True.json"
        "./data/perturbed_data/val_split/range_False.json"
        "./data/perturbed_data/val_split/negative_True.json"
        "./data/perturbed_data/val_split/negative_False.json"
        "./data/perturbed_data/val_split/obfuscation_True.json"
        "./data/perturbed_data/val_split/obfuscation_False.json"
    )
    TEST_JSON=(
        "./data/perturbed_data/test_split/numeration_True.json"
        "./data/perturbed_data/test_split/numeration_False.json"
        "./data/perturbed_data/test_split/approximation_True.json"
        "./data/perturbed_data/test_split/approximation_False.json"
        "./data/perturbed_data/test_split/range_True.json"
        "./data/perturbed_data/test_split/range_False.json"
        "./data/perturbed_data/test_split/negative_True.json"
        "./data/perturbed_data/test_split/negative_False.json"
        "./data/perturbed_data/test_split/obfuscation_True.json"
        "./data/perturbed_data/test_split/obfuscation_False.json"
    )
}

# ==============================================================================
# PEFT QWEN3-8B EXPERIMENTS
# ==============================================================================

# LoRA (Low-Rank Adaptation)
exp_peft_qwen3_8b_lora() {
    _set_peft_defaults
    PEFT_METHOD="lora"
    PEFT_RANK=32
}

# LoRA with higher rank
exp_peft_qwen3_8b_lora_r64() {
    _set_peft_defaults
    PEFT_METHOD="lora"
    PEFT_RANK=64
}

# Prompt Tuning
exp_peft_qwen3_8b_prompt_tuning() {
    _set_peft_defaults
    PEFT_METHOD="prompt_tuning"
    PEFT_VIRTUAL_TOKENS=20
}

# Prefix Tuning
exp_peft_qwen3_8b_prefix_tuning() {
