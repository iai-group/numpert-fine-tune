    PEFT_RANK=32
    PEFT_VIRTUAL_TOKENS=20
}

# LoRA + Prefix Tuning Combined
exp_peft_qwen3_8b_lora_prefix() {
    _set_peft_defaults
    PEFT_METHOD="lora_prefix"
    PEFT_RANK=32
    PEFT_VIRTUAL_TOKENS=20
}

# Quick test (all methods, 1 epoch)
exp_peft_qwen3_8b_quick_test() {
    _set_peft_defaults
    PEFT_METHOD="lora"
    NUM_TRAIN_EPOCHS=1
    BATCH_SIZE=2
}