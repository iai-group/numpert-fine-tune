#!/bin/bash
################################################################################
# Experiment Configuration Registry
#
# Each experiment is a bash function that sets training variables.
# Add new experiments by defining a new function prefixed with "experiment_".
#
# USAGE:
#   bash scripts/train/run_experiment.sh <experiment_name>   # run locally
#   bash scripts/train/run_experiment.sh --list              # list all
#   bash scripts/train/run_experiment.sh --show <name>       # show config
#   sbatch scripts/slurm_experiment.sh <name>          # via SLURM
#
# NAMING CONVENTION:
#   experiment_<model>_<data>_<batching>[_<variant>]
#   e.g. experiment_qwen3_8b_numeration_enhanced
#
# ADDING A NEW EXPERIMENT:
#   1. Copy any existing function below
#   2. Rename it with the experiment_ prefix
#   3. Adjust the variables
#   That's it — the launcher auto-discovers all experiment_ functions.
################################################################################


# ==============================================================================
# DEFAULTS — inherited by all experiments unless overridden
# ==============================================================================
_set_defaults() {
    # Model
    MODEL="Qwen3-8B"
    RANK=32
    START_EPOCH=0
    NUM_TRAIN_EPOCHS=2
    RESUME_MODEL=""

    # Training
    BATCH_SIZE=5
    GRAD_ACCUM=1
    MAX_SEQ_LENGTH=16384

    # Include perturbs
    USE_PERTURBATIONS=TRUE

    # Balancing
    METHOD_BALANCE_MODE=oversample
    PERTURB_RATIO=1.0 # Quite aggressive perturb to normal ratio (1.0 = 50:50)
    FALSE_PERTURB_T_TO_F_RATIO=0.67

    # Batch matching (off by default = normal batching)
    BATCH_MATCH_CLAIM_ID=false
    SPLIT_LARGE_CLAIMS=false
    ENSURE_ORIGINAL_IN_BATCH=false
    ENSURE_PERTURBED_IN_BATCH=false

    # Eval & checkpointing
    EVAL_STEPS=0.25

    # GGUF
    SAVE_GGUF=false
    GGUF_QUANT_METHOD="q4_k_m"

    # Debug
    DEBUG=false
}


# All perturbation types with type filtering
# Per PERTURBATIONS.md:
#   numeration:    type1, type2
#   approximation: type1, type2
#   range:         type1, type2
#   negative:      type2 only
#   obfuscation:   type3 only (random, masked)
# For False files: exclude type2 (double negation → noisy labels)
_no_numeration_no_f2f_type2() {
    TRAIN_JSON=(
        "./data/perturbed_data/train_split/approximation_True.json:type1,type2"
        "./data/perturbed_data/train_split/approximation_False.json:type1"
        "./data/perturbed_data/train_split/range_True.json:type1,type2"
        "./data/perturbed_data/train_split/range_False.json:type1"
        "./data/perturbed_data/train_split/negative_True.json:type2"
        "./data/perturbed_data/train_split/negative_False.json:type2"
        "./data/perturbed_data/train_split/obfuscation_True.json:type3_random,type3_masked"
        "./data/perturbed_data/train_split/obfuscation_False.json:type3_random,type3_masked"
    )
    VAL_JSON=(
        "./data/perturbed_data/val_split/approximation_True.json:type1,type2"
        "./data/perturbed_data/val_split/approximation_False.json:type1"
        "./data/perturbed_data/val_split/range_True.json:type1,type2"
        "./data/perturbed_data/val_split/range_False.json:type1"
        "./data/perturbed_data/val_split/negative_True.json:type2"
        "./data/perturbed_data/val_split/negative_False.json:type2"
